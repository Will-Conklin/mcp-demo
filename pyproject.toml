[project]
name = "mcp-tinydb-server"
version = "0.1.0"
description = "Model Context Protocol server for TinyDB document database operations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.23.1",
    "tinydb>=4.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "ty>=0.0.1a32",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
